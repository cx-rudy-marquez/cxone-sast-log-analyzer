{% extends "base.html" %}
{% block title %}Error · Log Viewer{% endblock %}
{% block content %}
  <div class="panel">
    <div class="card-header">
      <h2 class="card-title">{{ title or "Error" }}</h2>
    </div>
    <div class="alert error">
      <div style="font-weight:600">{{ message }}</div>
      {% if details %}
      <pre class="mono" style="margin-top:10px">{{ details }}</pre>
      {% endif %}
    </div>
    <div class="card-tools">
      <a class="btn ghost" href="{{ url_for('index') }}">Back</a>
    </div>
  </div>
{% endblock %}
